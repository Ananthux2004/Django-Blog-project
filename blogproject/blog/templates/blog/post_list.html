<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Post List</title>
  </head>
  <body>
    <h1>Posts</h1>

    {% if posts %}
    <ul>
      {% for post in posts %}
      <li>
        <a href="{% url 'post_detail' pk=post.pk %}">{{ post.title }}</a>
        — {{ post.author.user.username }} — {{ post.created_date }}
      </li>
      {% endfor %}
    </ul>
    {% else %}
    <p>No posts available.</p>
    {% endif %}
  </body>
</html>
