<!-- blog/templates/blog/components/post_card.html -->
<div class="card h-100 border-0 shadow-sm rounded-3">
    {% if post.featured_image %}
        <img src="{{ post.featured_image.url }}" class="card-img-top" alt="{{ post.title }}" style="height: 180px; object-fit: cover;">
    {% endif %}
    <div class="card-body d-flex flex-column">
        <div class="mb-2">
            {% if post.category %}
                <span class="badge bg-primary-subtle text-primary border border-primary-subtle">{{ post.category.name }}</span>
            {% endif %}
        </div>
        <h5 class="card-title fw-bold">
            <a href="{% url 'blog:post_detail' post.slug %}" class="text-decoration-none text-dark">{{ post.title }}</a>
        </h5>
        <p class="card-text text-muted small flex-grow-1">
            {{ post.excerpt|default:post.content|truncatewords:20 }}
        </p>
        <div class="d-flex justify-content-between align-items-center pt-3 border-top mt-auto">
            <span class="text-muted small"><i class="bi bi-calendar3 me-1"></i>{{ post.created_date|date:"M d, Y" }}</span>
            <a href="{% url 'blog:post_detail' post.slug %}" class="btn btn-sm btn-outline-primary rounded-pill">Read More</a>
        </div>
    </div>
</div>
