{% load static %}
<nav
  class="navbar navbar-expand-lg navbar-light bg-light border-bottom sticky-top"
>
  <div class="container">
    <a class="navbar-brand fw-bold" href="/blog/">
      <span>DevBlog</span>
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
      aria-controls="navbarNav"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <form class="d-flex ms-lg-auto me-lg-3 mt-3 mt-lg-0" role="search">
        <input
          class="form-control me-2"
          type="search"
          placeholder="Search posts, categories, authors..."
          aria-label="Search"
        />
      </form>

      <ul class="navbar-nav ms-lg-2">
        <li class="nav-item">
          <a class="nav-link" href="/blog/">Home</a>
        </li>

        <li class="nav-item dropdown">
          <a
            class="nav-link dropdown-toggle"
            href="#"
            role="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            Categories
          </a>
          <ul class="dropdown-menu">
            <li>
              <a class="dropdown-item" href="#">#tech</a>
            </li>
            <li>
              <a class="dropdown-item" href="#">#design</a>
            </li>
            <li>
              <a class="dropdown-item" href="#">#ai</a>
            </li>
            <li>
              <a class="dropdown-item" href="#">#javascript</a>
            </li>
          </ul>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="#">About</a>
        </li>

        {% if user.is_authenticated %}
        <li class="nav-item">
          <a class="nav-link fw-bold" href="#">{{ user.username }}</a>
        </li>
        <li class="nav-item">
          <form
            class="ms-lg-3"
            method="post"
            action="{% url 'accounts:logout' %}"
          >
            {% csrf_token %}
            <button class="btn btn-outline-danger fw-bold" type="submit">
              Logout
            </button>
          </form>
        </li>
        {% else %}
        <li class="nav-item">
          <a
            class="btn btn-primary fw-bold ms-lg-3 me-2"
            href="{% url 'accounts:login' %}"
          >
            Login
          </a>
        </li>
        <li class="nav-item">
          <a
            class="btn btn-success fw-bold"
            href="{% url 'accounts:register' %}"
          >
            Register
          </a>
        </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
