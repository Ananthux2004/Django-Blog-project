{% load static %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/">DevBlog</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-item nav-link" href="{% url 'blog:post_list' %}">Posts</a>
        </li>
        <li class="nav-item">
          <a class="nav-item nav-link" href="{% url 'blog:category_list' %}">Categories</a>
        </li>
        <li class="nav-item">
          <a class="nav-item nav-link" href="{% url 'blog:tag_list' %}">Tags</a>
        </li>
      </ul>
      
      <!-- Part 5: Persistent GET Search Box -->
      <form class="d-flex me-3" method="GET" action="{% url 'blog:search' %}">
        <input class="form-control me-2" type="search" name="q" placeholder="Search blog..." aria-label="Search" value="{{ request.GET.q }}">
        <button class="btn btn-outline-success" type="submit">Search</button>
      </form>

      <ul class="navbar-nav mb-2 mb-lg-0">
  {% if user.is_authenticated %}
    <!-- 1. Greets the logged-in user with their active username -->
    <li class="nav-item">
      <span class="nav-link text-white-50 me-2">Welcome, <strong>{{ user.username }}</strong>!</span>
    </li>
    
    <!-- 2. Bulletproof hardcoded path ensures it never throws a NoReverseMatch error -->
    <li class="nav-item">
      <a class="nav-link" href="/accounts/profile/">Profile</a>
    </li>
    
    {% if user.is_staff %}
      <li class="nav-item">
        <a class="nav-link" href="{% url 'admin:index' %}">Admin</a>
      </li>
    {% endif %}
    
    <li class="nav-item">
  <form method="POST" action="{% url 'accounts:logout' %}" class="d-inline">
    {% csrf_token %}
    <button type="submit" class="btn btn-link nav-link d-inline p-0 border-0" style="vertical-align: baseline;">
      Logout
    </button>
  </form>
 </li>
  {% else %}
    <!-- Displayed only to logged-out guest browsers -->
    <li class="nav-item">
      <a class="nav-link" href="{% url 'accounts:login' %}">Login</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="{% url 'accounts:register' %}">Register</a>
    </li>
  {% endif %}
</ul>
    </div>
  </div>
</nav>
