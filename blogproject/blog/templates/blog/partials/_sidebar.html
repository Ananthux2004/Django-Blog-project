<aside class="sidebar-wrapper">

  <!-- DISCOVER TOPICS (TAGS) WIDGET -->
  <div class="sidebar-widget">
    <div class="d-flex align-items-center gap-2 mb-3 pb-2 border-bottom">
      <i class="bi bi-tags text-dark fs-5"></i>
      <h5 class="fw-bold text-dark m-0 fs-6 text-uppercase tracking-wide">Recommended Topics</h5>
    </div>

    <div class="d-flex flex-wrap gap-2">
      {% for tag in sidebar_tags %}
        <a href="{% url 'blog:tag_detail' slug=tag.slug %}" class="badge bg-light text-dark text-decoration-none fw-normal rounded-pill px-3 py-2 border hover-tag">
          #{{ tag.name }}
          {% if tag.post_count %}
            <span class="text-muted ms-1 fs-8">({{ tag.post_count }})</span>
          {% endif %}
        </a>
      {% empty %}
        <span class="text-muted small">No topics available yet.</span>
      {% endfor %}
    </div>
  </div>

</aside>

<style>
  .tracking-wide {
    letter-spacing: 0.05em;
  }
  .hover-tag {
    transition: all 0.2s ease-in-out;
  }
  .hover-tag:hover {
    background-color: #212529 !important;
    color: #fff !important;
    border-color: #212529 !important;
  }
  .hover-tag:hover .text-muted {
    color: #e0e0e0 !important;
  }
</style>
